plugins {
  id 'com.android.application'
}
android {
  namespace 'br.com.superfacil.lotofacil'
  compileSdk 35
  defaultConfig {
    applicationId 'br.com.superfacil.lotofacil'
    minSdk 24
    targetSdk 35
    versionCode 2
    versionName '2.0.1-beta'
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
