name: Importar banners finais
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-banners.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar disponibilidade das imagens originais
        env:
          URL1: 'https://media.canva.com/v2/image-resize/format:PNG/height:821/quality:100/uri:ifs%3A%2F%2FM%2F37289ab4-00b5-47c5-a900-735998eb88b5/watermark:F/width:1916?csig=AAAAAAAAAAAAAAAAAAAAAJszZvysSvaZUjrTYb3XyS-qOX9EFyQ4b-Ji_XwHnfsV&exp=1793058257&osig=AAAAAAAAAAAAAAAAAAAAABb8QrTUuwS8JSNdAkKQZ4ciQAbu7doZ2lpeypwFP9X8&signer=media-rpc&token=AAIAAU0AJDM3Mjg5YWI0LTAwYjUtNDdjNS1hOTAwLTczNTk5OGViODhiNQAAAAABoXqZuGgRi8naqb8B0rQeDfSVwEId7KCG6dkQd7MZwzakkvEBXQ&x-canva-quality=original'
          URL2: 'https://media.canva.com/v2/image-resize/format:PNG/height:821/quality:100/uri:ifs%3A%2F%2FM%2Fa927734d-2baf-4583-ab3c-496990a9b599/watermark:F/width:1916?csig=AAAAAAAAAAAAAAAAAAAAAMGHS8l5CQ5_xD4SoB-4TGtncjQeV3K8wLxKT4hMgcVw&exp=1793059947&osig=AAAAAAAAAAAAAAAAAAAAADPl_lfh8ubRwnUm6XeRixZU-P1YtwbwxqkvR4eiz2ov&signer=media-rpc&token=AAIAAU0AJGE5Mjc3MzRkLTJiYWYtNDU4My1hYjNjLTQ5Njk5MGE5YjU5OQAAAAABoXqzgfi-M-6E-LXgoUJ2_kUDnnSxpGy-rYFl7KFqvuVv7FZquA&x-canva-quality=original'
          URL3: 'https://media.canva.com/v2/image-resize/format:PNG/height:821/quality:100/uri:ifs%3A%2F%2FM%2F154228a9-dc44-4a86-934c-7ff8fa9b00bd/watermark:F/width:1916?csig=AAAAAAAAAAAAAAAAAAAAAAbDDM09KGO5nug7-25BeSenyMR5P62KO5uukQDJE__g&exp=1793058260&osig=AAAAAAAAAAAAAAAAAAAAAEFb7XIoRH89rE41c_FypCRD2pI7VXXd44gJ7_px1r1E&signer=media-rpc&token=AAIAAU0AJDE1NDIyOGE5LWRjNDQtNGE4Ni05MzRjLTdmZjhmYTliMDBiZAAAAAABoXqZxCDIQY_vc38ic9V1zQaPUsMCrNKbhwGuv8yd0oMxd1eS0A&x-canva-quality=original'
        run: |
          mkdir -p public
          for i in 1 2 3; do
            key=URL$i
            url="${!key}"
            code=$(curl -L --silent --show-error --max-time 40 -o "public/news-$i.png" -w '%{http_code}' "$url")
            bytes=$(stat -c %s "public/news-$i.png")
            echo "Banner $i: HTTP $code, $bytes bytes"
            if [ "$code" != 200 ] || [ "$bytes" -lt 20000 ]; then
              echo "A mídia original não está disponível para exportação direta"
              exit 1
            fi
            file "public/news-$i.png"
          done
      - name: Anexar banners PNG ao repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/news-1.png public/news-2.png public/news-3.png
          git commit -m 'assets: adicionar tres banners finais de noticias Lotofacil' || exit 0
          git push origin HEAD:main
